  redis:
    image: redis:7-alpine
    container_name: pdf_service_redis
    hostname: pdf_service_redis
    command: redis-server --aclfile /etc/redis/redis.acl --requirepass pdf_service_pwd --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    ports:
      - '6379:6379'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - redis-data:/data
      - ./redis.acl:/etc/redis/redis.acl:ro
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          'pdf_service_pwd',
          '-u',
          'pdf_service',
          'ping',
        ]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - pdf-network

